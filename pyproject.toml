[project]
name = "nonebot-plugin-advisor"
version = "v0.0.2"
description = "一个多功能的、跨平台的 LLM 项目客服。"
readme = "README.md"
requires-python = ">= 3.10, < 4.0"
authors = [{ name = "owner", email = "owner@gmail.com" }]
dependencies = [
  "curl-cffi>=0.7.0",                           # 带 TLS 指纹模拟的 HTTP 客户端
  "httpx >= 0.27.0,<1.0.0",
  "nonebot-plugin-alconna >= 0.60.0,<1.0.0",    # 跨平台命令解析拓展
  "nonebot-plugin-apscheduler >= 0.5.0,<1.0.0", # 定时任务
  "nonebot-plugin-localstore >= 0.7.4,<1.0.0",  # 存储文件
  "nonebot-plugin-uninfo >= 0.10.0,<1.0.0",     # 多平台用户信息获取
  "nonebot2 >= 2.5.0,<3.0.0",
  "openai>=3.8.0",
  "pillow>=10.0.0",   # 图片查看/标注
]

[project.urls]
Homepage = "https://github.com/owner/nonebot-plugin-advisor"
Issues = "https://github.com/owner/nonebot-plugin-advisor/issues"
Repository = "https://github.com/owner/nonebot-plugin-advisor.git"

[dependency-groups]
dev = [
  "bump-my-version >= 1.2.7",
  "nonebot2[fastapi] >= 2.5.0,<3.0.0",
  "poethepoet >= 0.42.1",
  "ruff >= 0.15.2,<1.0.0",
  { include-group = "test" },
]
test = [
  "nb-cli >= 1.7.4",
  "nonebot-adapter-onebot >= 2.4.6,<3.0.0",
  "nonebot2[fastapi] >= 2.5.0,<3.0.0",
  "nonebug >= 0.4.4,<1.0.0",
  "pytest >= 9.0.2,<10.0.0",
  "poethepoet >= 0.42.1",
  "pytest-asyncio >= 1.3.0,<1.4.0",
  "pytest-cov >= 7.0.0",
  "pytest-xdist >= 3.8.0,<4.0.0",
]

[build-system]
requires = ["uv_build >= 0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.bumpversion]
current_version = "0.1.0"
commit = true
message = "release: bump vesion from {current_version} to {new_version}"
tag = true

[[tool.bumpversion.files]]
filename = "uv.lock"
search = "name = \"nonebot-plugin-advisor\"\nversion = \"{current_version}\""
replace = "name = \"nonebot-plugin-advisor\"\nversion = \"{new_version}\""

[tool.coverage.report]
exclude_lines = [
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@overload",
  "except ImportError:",
]

[tool.nonebot]
plugin_dirs = ["src/"]
builtin_plugins = []

[tool.nonebot.adapters]
nonebot-adapter-onebot = [{name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11"}]

[tool.poe.tasks]
test = "pytest --cov=src --cov-report xml --junitxml=./junit.xml -n auto"
bump = "bump-my-version bump"
show-bump = "bump-my-version show-bump"

[tool.pyright]
pythonVersion = "3.10"
pythonPlatform = "All"
defineConstant = { PYDANTIC_V2 = true }
executionEnvironments = [
  { root = "./tests", extraPaths = [
    "./src",
  ] },
  { root = "./src" },
]
typeCheckingMode = "standard"
disableBytesTypePromotions = true

[tool.pytest]
addopts = [
  "--import-mode=prepend", # 导入模式
  "--strict-markers",      # 严格标记模式
  "--tb=short",            # 简短的错误回溯
  "-ra",                   # 显示所有测试结果摘要
  "-s",                    # 显示打印信息
  "-v",                    # 详细输出
]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.format]
line-ending = "lf"
quote-style = "single"

[tool.ruff.lint]
select = [
  "F",     # Pyflakes
  "W",     # pycodestyle warnings
  "E",     # pycodestyle errors
  "I",     # isort
  "UP",    # pyupgrade
  "ASYNC", # flake8-async
  "C4",    # flake8-comprehensions
  "T10",   # flake8-debugger
  "T20",   # flake8-print
  "PYI",   # flake8-pyi
  "PT",    # flake8-pytest-style
  "Q",     # flake8-quotes
  "TID",   # flake8-tidy-imports
  "RUF",   # Ruff-specific rules
]
ignore = [
  "E402",   # module-import-not-at-top-of-file
  "UP037",  # quoted-annotation
  "RUF001", # ambiguous-unicode-character-string
  "RUF002", # ambiguous-unicode-character-docstring
  "RUF003", # ambiguous-unicode-character-comment
  "W191",   # indentation contains tabs
  "TID252", # relative-import
]

[tool.ruff.lint.isort]
length-sort = true
known-first-party = ["tests/*"]
extra-standard-library = ["typing_extensions"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true
